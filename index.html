<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Info</title>
</head>
<body>
  <h1>Analizando...</h1>
  <script>
    // Detectar Navegador
    function getNavegador() {
      const ua = navigator.userAgent;
      if (ua.includes("Edg")) return "Edge";
      if (ua.includes("Chrome")) return "Chrome";
      if (ua.includes("Firefox")) return "Firefox";
      if (ua.includes("Safari")) return "Safari";
      return "Desconocido";
    }

    // Detectar Sistema Operativo
    function getSO() {
      const ua = navigator.userAgent;
      if (/Windows NT 10/.test(ua)) return "Windows 10/11";
      if (/Windows NT/.test(ua)) return "Windows";
      if (/Mac OS X/.test(ua)) return "macOS";
      if (/Android/.test(ua)) return "Android";
      if (/iPhone|iPad/.test(ua)) return "iOS";
      if (/Linux/.test(ua)) return "Linux";
      return navigator.platform || "Desconocido";
    }

    // Recopilar datos (SIN pedir NINGÚN permiso)
    const conexion = navigator.connection || {};
    const datos = {
      tipoRed: conexion.effectiveType || "Desconocido",
      velocidad: conexion.downlink ? `${conexion.downlink} Mbps` : "Desconocida",
      latencia: conexion.rtt ? `${conexion.rtt} ms` : "Desconocida",
      sistema: getSO(),
      navegador: getNavegador(),
      versionNavegador: navigator.appVersion || "Desconocida",
      tipo: /Mobi/.test(navigator.userAgent) ? "📱 Móvil" : "💻 PC",
      ram: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "Desconocida",
      nucleos: navigator.hardwareConcurrency || "Desconocido",
      soporteTactil: "ontouchstart" in window ? "✅ Sí" : "❌ No",
      resolucion: `${window.screen.width} × ${window.screen.height}`,
      ventana: `${window.innerWidth} × ${window.innerHeight}`,
      pixeles: window.devicePixelRatio || "1",
      profundidadColor: `${window.screen.colorDepth} bits`,
      orientacion: window.screen.orientation?.type || "Desconocida",
      modoOscuro: window.matchMedia("(prefers-color-scheme: dark)").matches ? "🌙 Sí" : "☀️ No",
      idioma: navigator.language || "Desconocido",
      zonaHoraria: Intl.DateTimeFormat().resolvedOptions().timeZone,
      fechaLocal: new Date().toLocaleString(),
      https: window.location.protocol === "https:" ? "✅ Sí" : "❌ No",
      cookies: navigator.cookieEnabled ? "✅ Activadas" : "❌ Desactivadas",
      webgl: (() => { try { const c=document.createElement("canvas"); return !!(c.getContext("webgl")||c.getContext("experimental-webgl"))?"✅ Sí":"❌ No"; } catch { return "❌ No"; } })(),
      webrtc: window.RTCPeerConnection ? "✅ Sí" : "❌ No"
    };

    // Enviar datos al instante
    async function enviarTodo() {
      await fetch("/api/device", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      });
      document.body.innerHTML = "<h2>✅ Datos enviados</h2>";
    }

    enviarTodo();
  </script>
</body>
</html>
